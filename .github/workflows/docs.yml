name: Docs

# Builds the documentation site in website/ and publishes it to GitHub Pages.
# A pull request only builds it. A push to main also publishes it.
# The site reads the snapshots of the image tests, the fonts and the icon from the repository,
# so a change to them builds it again.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'crates/mortise-app/tests/snapshots/**'
      - 'assets/fonts/**'
      - 'assets/icon/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'crates/mortise-app/tests/snapshots/**'
      - 'assets/fonts/**'
      - 'assets/icon/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
