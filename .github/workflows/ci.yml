name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # git-cliff builds CHANGELOG.md from these subjects, so a release depends on them.
  commits:
    name: Check Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit subjects
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|revert|docs|build|ci|chore|style|test)(\([a-z0-9_,-]+\))?!?: .+'
          bad=$(git log --no-merges --format=%s "$RANGE" | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commit subjects must follow Conventional Commits (https://www.conventionalcommits.org):"
            echo "$bad"
            exit 1
          fi

  # Markdown-only changes and changes to the docs site (website/, built by docs.yml) skip the build and the tests.
  # A skipped matrix job reports one check under its unexpanded name, so do not make the "Build and test" checks required: a Markdown-only PR would wait for them.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      openspec: ${{ steps.filter.outputs.openspec }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!website/**'
            openspec:
              - 'openspec/**'

  # Validates every OpenSpec change and spec. A requirement without a scenario fails under --strict.
  openspec:
    name: Validate OpenSpec
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes @fission-ai/openspec@1.16.0 validate --all --strict --no-interactive

  # Fails on a RustSec vulnerability in Cargo.lock. It runs on every change, Markdown too,
  # because new advisories arrive without a change here.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Fails on a verified, unverified or unknown secret anywhere in the git history.
  # It runs on every change, Markdown too, because a secret can sit in any file.
  # Cargo.lock is left out: its checksums look like keys to some detectors.
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # An empty base with a head scans the whole history, so a push never compares a commit with itself.
      # The action already passes --fail and --no-update, and a repeated flag is an error.
      - uses: trufflesecurity/trufflehog@v3.99.8
        with:
          base: ''
          head: HEAD
          version: 3.99.8
          extra_args: --results=verified,unknown,unverified --exclude-paths=.github/trufflehog-exclude.txt

  # rustfmt.toml holds the style. Run `cargo fmt --all` before you commit.
  fmt:
    name: Check formatting
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # rust-toolchain.toml names the version and the components.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  # licenses/THIRD-PARTY.md must list the crates of Cargo.lock. Run tools/third-party-licenses.py after a dependency changed.
  licenses:
    name: Check the licence list
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: python3 tools/third-party-licenses.py
      - name: Compare with the committed list
        run: |
          if ! git diff --exit-code -- licenses; then
            echo "::error::licenses/THIRD-PARTY.md is out of date. Run python3 tools/third-party-licenses.py and commit the result."
            exit 1
          fi

  # The image tests compare with macOS baselines, so only the macOS job runs them, and it measures coverage.
  # Linux and Windows run the same tests, where the image tests compile to nothing.
  test:
    name: Build and test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      # Build scripts and tests come from the pull request, so they get no token in the Git config.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # What eframe links against, and a software Vulkan driver so the headless interface tests can draw.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: runner.os != 'macOS'
        run: cargo test --workspace --locked --no-fail-fast

      - name: Install cargo-llvm-cov
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        if: runner.os == 'macOS'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --workspace --locked --no-fail-fast --no-report

      # A failing image test writes the new image and the difference: keep them to look at.
      - name: Keep the images that differ
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: images-that-differ
          path: |
            crates/mortise-app/tests/snapshots/*.new.png
            crates/mortise-app/tests/snapshots/*.diff.png
          if-no-files-found: ignore

      - name: Write the coverage summary
        if: runner.os == 'macOS'
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write the coverage report
        if: runner.os == 'macOS'
        run: cargo llvm-cov report --html
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: coverage
          path: target/llvm-cov/html
          if-no-files-found: error

  # Builds the command line tool alone, so mortise-core comes without its default features and
  # nothing of the window is built: Linux gets no window packages here. Then it runs the built tool
  # on the fixture shop-api, which has a circle and three reads of Billing internals, and checks the
  # exit codes and the paths on each platform: relative to the app, with `/` between the parts.
  # The github format goes to a file, so that the fixture's problems do not mark the pull request.
  cli:
    name: Command line tool (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p mortise-cli --locked
      - name: Check shop-api in each format
        shell: bash
        run: |
          out="$RUNNER_TEMP/check"
          mkdir -p "$out"
          for format in text github json; do
            status=0
            target/debug/mortise check fixtures/shop-api --format "$format" > "$out/$format" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::mortise check --format $format exited $status, not 1."
              exit 1
            fi
          done
          cat "$out/text"
          grep -qxF 'Modules/Checkout/app/Listeners/RequestShipment.php:6: problem: Checkout and Shipping use each other. 2 files in Checkout, 4 files in Shipping.' "$out/text"
          test "$(grep -cF 'problem: Checkout reads Modules\Billing\Models\Invoice directly.' "$out/text")" -eq 3
          grep -qxF '2 problems, 1 warning. 7 modules checked against 2 rules and 4 checks.' "$out/text"
          grep -qF '::error file=Modules/Checkout/app/Services/InvoiceSync.php,line=5,title=Public surface only::' "$out/github"
          # No path names a drive or a root or holds a backslash. A path in text ends at the first space.
          if grep -E '^([A-Za-z]:|/|[^ ]*\\)' "$out/text" || grep -E 'file=([A-Za-z]:|/|[^,]*\\)' "$out/github"; then
            echo "::error::A path in the output is not relative with /."
            exit 1
          fi
          jq -e '[.list[].check] == ["NoCircularUse", "PublicSurfaceOnly", "CoverageLimit"]' "$out/json"
      # A copy of shop-api with a broken module.json gives a finding with a path in the json format.
      - name: Check the path of a broken module.json in json
        shell: bash
        run: |
          app="$RUNNER_TEMP/broken/shop-api"
          mkdir -p "$RUNNER_TEMP/broken"
          cp -R fixtures/shop-api "$app"
          echo '{ "name": ' > "$app/Modules/Catalog/module.json"
          status=0
          target/debug/mortise check "$app" --format json > "$RUNNER_TEMP/broken.json" || status=$?
          test "$status" -eq 1
          jq -e '[.list[].detail.InvalidManifest.file // empty] == ["Modules/Catalog/module.json"]' "$RUNNER_TEMP/broken.json"
      - name: Check a folder that is not an app
        shell: bash
        run: |
          status=0
          target/debug/mortise check crates || status=$?
          test "$status" -eq 3
      # Users has an accepted surface in its module.json. A dry run needs no token.
      - name: Push shop-api without sending
        shell: bash
        run: |
          unset MORTISE_TOKEN
          target/debug/mortise push --dry-run fixtures/shop-api > "$RUNNER_TEMP/push.json"
          jq -e '.app_path == "fixtures/shop-api"' "$RUNNER_TEMP/push.json"
          jq -e '.snapshot.modules[] | select(.name == "Users") | .surface.classes == ["Modules\\Users\\Contracts\\UserLookup"]' "$RUNNER_TEMP/push.json"
          jq -e '[.snapshot.layout.modules_dir, .snapshot.layout.statuses_file, .snapshot.coverage_report.path,
                  .snapshot.modules[].dir, .snapshot.links[].refs[].file]
                 | all(test("^[A-Za-z]:|^/|\\\\") | not)' "$RUNNER_TEMP/push.json"
          jq -e 'any(.snapshot.modules[].dir; . == "Modules/Billing")' "$RUNNER_TEMP/push.json"
      # The Tag release workflow publishes both crates to crates.io. This builds them as crates.io would,
      # from their packages, so a missing file or a wrong field shows here and not after a tag.
      # The feature testing builds only from files inside the crate. This checks it from the package,
      # outside the workspace, with the toolchain of rust-toolchain.toml.
      - name: Package the crates for crates.io
        if: runner.os == 'Linux'
        run: |
          cargo package --locked -p mortise-core -p mortise-cli
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          tar -xzf "target/package/mortise-core-$version.crate" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/mortise-core-$version"
          RUSTUP_TOOLCHAIN=$toolchain cargo check --locked --no-default-features --features testing --lib
      # tools/pack-cli.sh refuses an archive name with a folder before it writes or removes anything.
      - name: Refuse an archive name outside dist
        if: runner.os == 'Linux'
        run: |
          cp LICENSE "$RUNNER_TEMP/LICENSE.before"
          status=0
          tools/pack-cli.sh x86_64-unknown-linux-musl ../LICENSE || status=$?
          test "$status" -eq 2
          cmp LICENSE "$RUNNER_TEMP/LICENSE.before"

  # Feature gates do not depend on the platform, so Linux is enough. Each feature builds alone,
  # so a gate on the wrong file fails here and not only in a build with the default features.
  # It checks the library and the binaries only: the tests depend on the crate itself with its
  # default features, so a check of every target would turn every feature on.
  core-features:
    name: Check core features
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check each feature alone
        # A warning fails the check: an import that only one feature uses shows up as unused.
        env:
          RUSTFLAGS: -D warnings
        run: |
          for features in "" watch actuator os-secrets run testing push; do
            echo "::group::mortise-core with features: ${features:-none}"
            cargo check -p mortise-core --lib --bins --no-default-features ${features:+--features "$features"} --locked
            echo "::endgroup::"
          done

  # Looks at Mortise on Windows: it starts the window on the fixture shop-api, keeps a shot of the
  # desktop, then writes every screen of tests/screens.rs. A person looks at the artifacts; the job
  # compares nothing. A runner may give no desktop one day, so it is not required, and its failure
  # does not fail the run.
  windows-look:
    name: Windows looked at (not required)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p mortise-app --bin mortise-desktop --locked

      # Settings, the history of runs and secrets stay out of the runner's own folders.
      - name: Start the window, add the app and take shots of the desktop
        shell: pwsh
        env:
          MORTISE_CONFIG_DIR: ${{ runner.temp }}\mortise-config
          MORTISE_DATA_DIR: ${{ runner.temp }}\mortise-data
          MORTISE_SECRETS: memory
        run: tools/windows-look.ps1 -Exe target\debug\mortise-desktop.exe -App "$PWD\fixtures\shop-api" -Out "$env:RUNNER_TEMP\windows-look"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop
          path: ${{ runner.temp }}\windows-look
          if-no-files-found: error

      - name: Write every screen
        if: always()
        run: cargo test -p mortise-app --test screens --locked -- --ignored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: target/screens
          if-no-files-found: error

  # Runs the package's commands in a real app: the ignored tests of crates/mortise-core/tests/real_php.rs.
  # It is the only job that uses the network for Composer. A new release of the package can break it,
  # so it is not required, and its failure does not fail the run.
  real-php:
    name: Real PHP (Linux, not required)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite
          tools: composer

      # The skeleton uses SQLite and creates database/database.sqlite. The package autoloads
      # modules through wikimedia/composer-merge-plugin, which Composer must be allowed to run.
      - name: Create a Laravel app with laravel-modules
        working-directory: ${{ runner.temp }}
        run: |
          composer create-project laravel/laravel app --no-interaction --prefer-dist
          cd app
          composer config --no-plugins allow-plugins.wikimedia/composer-merge-plugin true
          composer require nwidart/laravel-modules:^13.3 --no-interaction
          composer config --json extra.merge-plugin '{"include": ["Modules/*/composer.json"]}'
          composer dump-autoload
          grep -qx 'DB_CONNECTION=sqlite' .env
          test -f database/database.sqlite
          composer show --direct | grep -E '^(laravel/framework|nwidart/laravel-modules) '

      - name: Run the ignored tests
        env:
          MORTISE_REAL_APP: ${{ runner.temp }}/app
        run: cargo test -p mortise-core --test real_php --locked -- --ignored --test-threads=1

  # The actuator client, the runtime per module and the placing of metrics, against a real app
  # with laravel-modules, laravel-actuator and laravel-metrics. A new release that changes an
  # answer fails this job only. The script prints the package versions.
  real-actuator:
    name: Real actuator (Linux, not required)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite
          tools: composer

      - name: Create a Laravel app with the actuator and metrics
        run: tools/real-actuator-app.sh "$RUNNER_TEMP/app"

      # One app, three servers. A process variable wins over .env. `--no-reload` hands it to the
      # PHP server: without it, `serve` drops each variable of $_ENV when variables_order has E.
      - name: Serve the app three times
        working-directory: ${{ runner.temp }}/app
        run: |
          php artisan serve --no-reload --host=127.0.0.1 --port=8931 > "$RUNNER_TEMP/serve-8931.log" 2>&1 &
          METRICS_ENABLED=false php artisan serve --no-reload --host=127.0.0.1 --port=8932 > "$RUNNER_TEMP/serve-8932.log" 2>&1 &
          METRICS_CACHE_STORE=metrics_broken php artisan serve --no-reload --host=127.0.0.1 --port=8933 > "$RUNNER_TEMP/serve-8933.log" 2>&1 &
          for port in 8931 8932 8933; do
            curl -sSf --retry 30 --retry-delay 1 --retry-connrefused --max-time 10 -o /dev/null "http://127.0.0.1:$port/actuator/health"
          done

      - name: Make traffic and run the queue
        working-directory: ${{ runner.temp }}/app
        run: |
          base=http://127.0.0.1:8931
          for path in /blog/posts/1 /blog/posts/2 /blog/posts/3 /blog/posts/1/publish /billing/invoices/1 /billing/invoices/1/charge /hello/ci; do
            curl -sSf --max-time 10 -o /dev/null "$base$path"
          done
          test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$base/blog/boom")" = 500
          php artisan queue:work --stop-when-empty
          curl -sSf --max-time 10 -o /dev/null "$base/actuator/prometheus"

      - name: Run the ignored tests
        env:
          MORTISE_REAL_ACTUATOR: http://127.0.0.1:8931/actuator
          MORTISE_REAL_ACTUATOR_EMPTY: http://127.0.0.1:8932/actuator
          MORTISE_REAL_ACTUATOR_503: http://127.0.0.1:8933/actuator
          MORTISE_REAL_APP: ${{ runner.temp }}/app
        run: cargo test -p mortise-core --test real_actuator --locked -- --ignored --test-threads=1

      - name: Show the server logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/serve-*.log

      - name: Stop the servers
        if: always()
        run: |
          pkill -f -- '--port=893[123]' || true
          pkill -f '127[.]0[.]0[.]1:893[123] ' || true
