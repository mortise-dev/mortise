# Builds the installers as artifacts: `dmg` (macOS, Apple silicon), `setup` (Windows x64) and `linux`
# (an AppImage and a .deb, x86_64). It also builds the command line tool, binary `mortise`, as one archive
# per platform (artifacts `cli-<platform>`): Linux x86_64 and arm64 (static, musl), macOS arm64 and
# Windows x64, and lists them with their SHA-256 sums (artifact `command-line-sums`). It never publishes.
# tag-release.yml calls it on the merge commit of a release PR, then tags and publishes.
#
# Run it from the Actions tab to build the installers of a branch without a release. A manual run with
# `quick` skips clippy and tests, and labels the files `-untested`. A pull request that changes the
# packaging runs it too, without the tests, which CI already runs. tag-release.yml has no `quick` input,
# so a release always tests.
#
# The Windows setup is not signed. The Linux packages are not signed. Nor are the Windows and Linux
# builds of the command line tool.
#
# The macOS app is signed with a Developer ID Application certificate and notarized by Apple, only when
# tag-release.yml calls with `sign: true`. Such an app opens without the "cannot verify the developer"
# warning. The job package-macos-signed does that, and it alone sets `environment: release`. The six Apple
# secrets are environment secrets of `release`, which allows deployments from main only. tag-release.yml
# passes each by name. A branch, a fork, a pull request and a manual run get no secret: they run
# package-macos, ad-hoc signed and not notarized. A release with a secret missing fails, and never ships
# ad-hoc signed. The macOS signing section of CONTRIBUTING.md says how to set the secrets up.
# The command line tool follows the same split: package-cli-macos without secrets, and
# package-cli-macos-signed in a release, which signs the binary and has Apple notarize its zip.
#
# The secrets reach only the step that runs cargo-packager. The job runs the reviewed merge commit with
# `--locked`, a pinned cargo-packager and its actions pinned to commits. It does not isolate the secrets
# from the dependencies of the app: a build script of a dependency runs on the same machine.
# cargo-packager fetches the create-dmg script at run time and runs it with the certificate and its
# password in the environment.
name: Installers

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build.
        type: string
        required: true
      tag:
        description: The release tag, vX.Y.Z. It must match the version in Cargo.toml and names the files.
        type: string
        required: false
        default: ''
      sign:
        description: Sign the macOS app with a Developer ID certificate and notarize it. A missing secret then fails the build.
        type: boolean
        required: false
        default: false
    secrets:
      APPLE_CERTIFICATE:
        description: The Developer ID Application certificate and its private key, as a .p12 file in base64.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: The password of that .p12 file.
        required: false
      APPLE_SIGNING_IDENTITY:
        description: 'The certificate name, such as "Developer ID Application: Name (TEAMID)".'
        required: false
      APPLE_API_ISSUER:
        description: The issuer ID of the App Store Connect API key.
        required: false
      APPLE_API_KEY:
        description: The key ID of the App Store Connect API key.
        required: false
      APPLE_API_KEY_P8:
        description: The contents of the AuthKey .p8 file of that key.
        required: false
  workflow_dispatch:
    inputs:
      quick:
        description: Skip clippy and tests, for a fast untested build.
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - crates/mortise-app/Cargo.toml
      - assets/icon/**
      - tools/pack-installer.sh
      - crates/mortise-cli/Cargo.toml
      - tools/check-cli.sh
      - tools/pack-cli.sh
      - tools/sign-macos-cli.sh
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: installers-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: '0.11.8'

jobs:
  test:
    name: Build and test (${{ matrix.name }})
    # Under workflow_call inputs.quick is null, so a release always runs this job.
    if: ${{ !inputs.quick && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      # A manual run has no `ref`, so it builds the commit the run started on.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      # No rust cache here: this job builds `inputs.ref`, and a cache written by that code could poison the cache of the default branch.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'macOS'
        with:
          name: images-that-differ
          path: |
            crates/mortise-app/tests/snapshots/*.new.png
            crates/mortise-app/tests/snapshots/*.diff.png
          if-no-files-found: ignore

  version:
    name: Read the app version
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # tools/release.sh sets the version on the first `version = ` line of Cargo.toml, in [workspace.package].
      - name: Read the version and name the installers
        id: read
        env:
          TAG: ${{ inputs.tag }}
          QUICK: ${{ inputs.quick }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml holds no version X.Y.Z on a version = line."
            exit 1
          fi
          if [ -n "$TAG" ]; then
            if [ "v$version" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match Cargo.toml version $version"
              exit 1
            fi
            label="$TAG"
          else
            label="v$version-$(git rev-parse --short=7 HEAD)"
          fi
          if [ "$QUICK" = "true" ]; then
            label="$label-untested"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

  package-windows:
    name: Build setup
    needs: [version, test]
    # Runs when the test job is skipped, never when a need failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      # No rust cache here, for the reason the test job gives.
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - run: cargo packager -p mortise-app --release --formats nsis
      - run: tools/pack-installer.sh '*-setup.exe' "Mortise-${{ needs.version.outputs.label }}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/*
          if-no-files-found: error

  # Ubuntu 22.04, so the packages run on systems with glibc 2.35 and later.
  package-linux:
    name: Build AppImage and deb
    needs: [version, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is an AppImage itself. This runs it without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - run: cargo packager -p mortise-app --release --formats appimage,deb
      - run: |
          tools/pack-installer.sh '*.AppImage' "Mortise-${{ needs.version.outputs.label }}-linux-x86_64.AppImage"
          tools/pack-installer.sh '*.deb' "Mortise-${{ needs.version.outputs.label }}-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # An ad-hoc signed app: every run that does not ask for a signed release.
  package-macos:
    name: Build dmg
    needs: [version, test]
    if: ${{ !cancelled() && !failure() && !inputs.sign }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - run: cargo packager -p mortise-app --release --formats app,dmg
      - run: tools/pack-installer.sh '*.dmg' "Mortise-${{ needs.version.outputs.label }}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*
          if-no-files-found: error

  # A signed and notarized app, for a release. The environment gives this job the Apple secrets, and only
  # when the run belongs to main. In a called workflow, the job that sets `environment` is the one that
  # gets the secrets of the environment, and the caller passes each secret by name.
  package-macos-signed:
    name: Build dmg (signed)
    needs: [version, test]
    if: ${{ !cancelled() && !failure() && inputs.sign }}
    runs-on: macos-latest
    environment: release
    steps:
      # Pinned to commits, because this job holds the Apple secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      # The app is built before the step that holds the secrets, and that step replaces the
      # before-packaging-command of cargo-packager, which would build again, with `true`. The two steps
      # share one machine, so this is not a wall between the build scripts of the dependencies and the
      # secrets. What holds is `--locked`, the pinned cargo-packager, the pinned actions, and that the
      # secrets exist only in a run on main, from the reviewed merge commit.
      - name: Build the app
        run: cargo build --release --locked -p mortise-app

      # cargo-packager 0.11.8 does what this step relies on:
      # - It signs only with the signing-identity of Cargo.toml and ignores APPLE_SIGNING_IDENTITY, so the
      #   step puts the identity in crates/mortise-app/Cargo.toml of this checkout, which is thrown away.
      # - APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD make it import the certificate into a temporary
      #   keychain of its own, sign with it, and delete it. It signs the binary, then the app and the DMG.
      #   Each gets the hardened runtime and a secure timestamp.
      # - With the three notarization variables it notarizes the app and staples the ticket to the app
      #   before it builds the DMG, so the DMG holds the stapled app. The DMG is signed but not notarized.
      # The API key is a file for notarytool, so it is written to a temporary folder and deleted when the step ends.
      - name: Package, sign and notarize
        # notarytool waits for Apple with no limit of its own.
        timeout-minutes: 60
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=''
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "$(printf '%s' "${!name}" | tr -d '[:space:]')" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::A release must be signed and notarized, and these secrets are empty or not set:$missing. Add them as environment secrets of the release environment, as the macOS signing section of CONTRIBUTING.md says."
            exit 1
          fi
          case "$APPLE_SIGNING_IDENTITY" in
            [[:space:]]* | *[[:space:]] | *[[:cntrl:]\"\\]*)
              echo '::error::APPLE_SIGNING_IDENTITY must have no space at either end, no control character such as a newline, no quote and no backslash.'
              exit 1
              ;;
          esac
          case "$APPLE_API_KEY" in
            *[!A-Za-z0-9]*)
              echo '::error::APPLE_API_KEY must be the key ID, letters and digits only.'
              exit 1
              ;;
          esac
          manifest=crates/mortise-app/Cargo.toml
          if ! awk '
            $0 == "signing-identity = \"-\"" { print "signing-identity = \"" ENVIRON["APPLE_SIGNING_IDENTITY"] "\""; n++; next }
            $0 == "before-packaging-command = \"cargo build --release --locked -p mortise-app\"" { print "before-packaging-command = \"true\""; m++; next }
            { print }
            END { exit (n != 1 || m != 1) }
          ' "$manifest" > "$RUNNER_TEMP/Cargo.toml.signed"; then
            echo "::error::$manifest must hold exactly one signing-identity = \"-\" line and one before-packaging-command = \"cargo build --release --locked -p mortise-app\" line for the release to replace."
            exit 1
          fi
          mv "$RUNNER_TEMP/Cargo.toml.signed" "$manifest"
          keys=$(mktemp -d "$RUNNER_TEMP/apple-key.XXXXXX")
          # A step that times out gets SIGTERM, which skips an EXIT trap in some shells, so trap it too.
          cleanup() { rm -rf "$keys"; }
          trap cleanup EXIT
          trap 'cleanup; exit 143' TERM
          trap 'cleanup; exit 130' INT
          key="$keys/AuthKey_$APPLE_API_KEY.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
          export APPLE_API_KEY_PATH="$key"
          unset APPLE_API_KEY_P8
          cargo packager -p mortise-app --release --formats app,dmg

      - run: tools/pack-installer.sh '*.dmg' "Mortise-${{ needs.version.outputs.label }}-macos-arm64.dmg"

      # What a user gets must pass: the app on the DMG, opened as a user opens it, and the app as built.
      # A failure stops the job, so nothing is uploaded.
      - name: Check the signed and notarized release
        env:
          NAME: Mortise-${{ needs.version.outputs.label }}-macos-arm64.dmg
        run: |
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir "$mnt"
          trap 'hdiutil detach "$mnt" -force -quiet || true' EXIT
          codesign --verify --strict --verbose=2 "dist/$NAME"
          details=$(codesign -dv --verbose=4 "dist/$NAME" 2>&1)
          grep -q '^Authority=Developer ID Application: ' <<<"$details"
          # The DMG shows the licence and asks to agree before it mounts. Without an answer hdiutil cancels.
          hdiutil attach -readonly -nobrowse -mountpoint "$mnt" "dist/$NAME" <<<"Y" >/dev/null
          tools/verify-macos-app.sh "$mnt/Mortise.app"
          tools/verify-macos-app.sh target/packages/Mortise.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg
          path: dist/*
          if-no-files-found: error

  # The command line tool for Linux (static, musl) and Windows. Each runner builds for its own
  # architecture, so ring and blake3 compile their C with the runner's own compiler, and
  # tools/check-cli.sh runs the binary before tools/pack-cli.sh packs it. cc finds musl-gcc by itself only for x86_64,
  # so CC_<target> names it for both. Windows links the C runtime statically, so the binary needs no
  # Visual C++ redistributable; the RUSTFLAGS of the target do not reach the build scripts.
  package-cli:
    name: Build command line tool (${{ matrix.name }})
    needs: [version, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
            ext: tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            ext: tar.gz
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            ext: zip
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: mortise-${{ needs.version.outputs.label }}-${{ matrix.platform }}.${{ matrix.ext }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install && rustup target add "$TARGET"
      # No rust cache here, for the reason the test job gives.
      - name: Install musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p mortise-cli --target "$TARGET"
      - run: tools/check-cli.sh "$TARGET"
      - run: tools/pack-cli.sh "$TARGET" "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # The command line tool for macOS, signed ad hoc by the linker: every run that does not ask for a
  # signed release.
  package-cli-macos:
    name: Build command line tool (macOS arm64)
    needs: [version, test]
    if: ${{ !cancelled() && !failure() && !inputs.sign }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ARCHIVE: mortise-${{ needs.version.outputs.label }}-macos-arm64.zip
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin
      - run: cargo build --release --locked -p mortise-cli --target aarch64-apple-darwin
      - run: tools/check-cli.sh aarch64-apple-darwin
      - run: tools/pack-cli.sh aarch64-apple-darwin "$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos-arm64
          path: dist/*
          if-no-files-found: error

  # The command line tool for macOS, signed with the Developer ID and notarized, for a release. It gets
  # the Apple secrets the way package-macos-signed does, and only in the step that signs.
  package-cli-macos-signed:
    name: Build command line tool (macOS arm64, signed)
    needs: [version, test]
    if: ${{ !cancelled() && !failure() && inputs.sign }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    env:
      ARCHIVE: mortise-${{ needs.version.outputs.label }}-macos-arm64.zip
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      # Pinned to commits, because this job holds the Apple secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin
      # Built and run before the step that holds the secrets, and run again after it. The step with the
      # secrets never runs the built binary. All steps share one machine: see package-macos-signed.
      - run: cargo build --release --locked -p mortise-cli --target aarch64-apple-darwin
      - run: tools/check-cli.sh aarch64-apple-darwin
      # A bare binary cannot hold a stapled ticket, so the zip goes to Apple and Gatekeeper looks the
      # ticket up online on first run.
      - name: Sign, pack and notarize
        # notarytool waits for Apple with a limit of 45 minutes, set in the script.
        timeout-minutes: 60
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: tools/sign-macos-cli.sh "$ARCHIVE"
      # The signed binary, without the secrets. tools/sign-macos-cli.sh checked that the zip holds it.
      - run: tools/check-cli.sh aarch64-apple-darwin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-macos-arm64
          path: dist/*
          if-no-files-found: error

  # The archive names are what nwidart/setup-mortise computes from the version, the system and the
  # architecture, so this job fails unless exactly those four are there. tag-release.yml writes the
  # sums of the release itself; this list is for a run that is not a release.
  cli-sums:
    name: List command line archives
    needs: [version, package-cli, package-cli-macos, package-cli-macos-signed]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Check the names and write the sums
        env:
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          cd dist
          expected=$(printf 'mortise-%s-%s\n' \
            "$LABEL" linux-x86_64.tar.gz "$LABEL" linux-arm64.tar.gz \
            "$LABEL" macos-arm64.zip "$LABEL" windows-x64.zip | sort)
          found=$(find . -type f -printf '%f\n' | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The command line archives are not the four expected names."
            diff <(echo "$expected") <(echo "$found") || true
            exit 1
          fi
          sha256sum -- * > "mortise-$LABEL-SHA256SUMS.txt"
          cat "mortise-$LABEL-SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: command-line-sums
          path: dist/mortise-*-SHA256SUMS.txt
          if-no-files-found: error
