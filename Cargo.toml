[workspace]
resolver = "3"
members = ["crates/mortise-core", "crates/mortise-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
mortise-core = { path = "crates/mortise-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
tempfile = "3"
directories = "6"
notify = "9"
notify-debouncer-full = "0.8"
rfd = "0.18"
quick-xml = "0.42"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
keyring = "4"

# The PHP parser. Its API changes inside 1.x, so every crate is pinned to one
# version and used only in `mortise_core::php`. Version 1.60 and later need
# Rust 1.100; move the pin and `rust-toolchain.toml` together.
mago-syntax = "=1.59.0"
mago-database = "=1.59.0"
mago-allocator = "=1.59.0"
mago-names = "=1.59.0"
mago-span = "=1.59.0"
rayon = "1"

egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "persistence",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }
# The image tests crop a part of the window. The same version as egui_kittest.
image = { version = "0.25.10", default-features = false }
winit = "0.30"
# Local clock time and dates of the runner history. std has no local time zone.
jiff = "0.2.28"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The interface is slow to draw without optimised dependencies.
[profile.dev.package."*"]
opt-level = 2
