[workspace]
resolver = "3"
members = ["crates/mortise-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
mortise-core = { path = "crates/mortise-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
tempfile = "3"

# The PHP parser. Its API changes inside 1.x, so every crate is pinned to one
# version and used only in `mortise_core::php`. Version 1.60 and later need
# Rust 1.100; move the pin and `rust-toolchain.toml` together.
mago-syntax = "=1.59.0"
mago-database = "=1.59.0"
mago-allocator = "=1.59.0"

egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "persistence",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The interface is slow to draw without optimised dependencies.
[profile.dev.package."*"]
opt-level = 2
