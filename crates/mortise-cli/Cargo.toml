[package]
name = "mortise-cli"
description = "The Mortise command line tool: checks the boundary rules of a Laravel app in CI and sends what it read to Mortise Cloud."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mortise"
path = "src/main.rs"

[dependencies]
# Reading and the push document only: no watch, no actuator, no credential store, no PHP runner.
mortise-core = { path = "../mortise-core", default-features = false, features = ["push"] }
serde_json.workspace = true
# Sending the push document: rustls with the certificates of the computer, no redirect.
ureq.workspace = true
flate2.workspace = true
# The time of a push document, in UTC.
jiff.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
