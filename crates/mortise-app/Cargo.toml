[package]
name = "mortise-app"
description = "The Mortise desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "mortise-desktop"

[lib]
name = "mortise_app"

# The window. The command line tool of `mortise-cli` is `mortise`.
[[bin]]
name = "mortise-desktop"
path = "src/main.rs"

# The artisan of the tests, the same as that of `mortise-core`, under another name:
# two binaries of one name in a workspace collide in the target folder. A release
# build leaves `testing` off, so it is not built.
[[bin]]
name = "app-fake-artisan"
path = "src/bin/app-fake-artisan.rs"
required-features = ["testing"]

[features]
# The helpers of `mortise_core::testing` and the fake artisan, for the tests.
testing = ["mortise-core/testing"]

[dependencies]
base64.workspace = true
cargo-packager-updater.workspace = true
eframe.workspace = true
jiff.workspace = true
minisign-verify.workspace = true
mortise-core.workspace = true
rfd.workspace = true
serde_json.workspace = true
tempfile.workspace = true
ureq.workspace = true

[dev-dependencies]
mortise-app = { path = ".", features = ["testing"] }
mortise-core = { workspace = true, features = ["testing"] }
egui_kittest.workspace = true
image.workspace = true

[lints]
workspace = true

# cargo-packager builds the installers from this table: `cargo packager -p mortise-app --release`.
# Paths are relative to this folder. The Installers workflow replaces the signing-identity line and
# the before-packaging-command line for a signed release, so keep each on one line as it is.
[package.metadata.packager]
product-name = "Mortise"
identifier = "com.nicolaswidart.mortise"
category = "DeveloperTool"
authors = ["Nicolas Widart"]
description = "Shows the modules of a Laravel app that uses nwidart/laravel-modules"
license-file = "../../LICENSE"
icons = [
    "../../assets/icon/macos/Mortise.icns",
    "../../assets/icon/windows/mortise.ico",
    "../../assets/icon/linux/hicolor/*/apps/mortise.png",
]
# The SIL Open Font License asks that each copy of the fonts ships with its licence.
resources = [
    "../../LICENSE",
    "../../licenses/THIRD-PARTY.md",
    { src = "../../assets/fonts/asap/OFL.txt", target = "licenses/Asap-OFL.txt" },
    { src = "../../assets/fonts/inconsolata/OFL.txt", target = "licenses/Inconsolata-OFL.txt" },
]
out-dir = "../../target/packages"
before-packaging-command = "cargo build --release --locked -p mortise-app"
binaries = [{ path = "mortise-desktop", main = true }]

[package.metadata.packager.macos]
signing-identity = "-"

# The setting of each system that asks for less motion (`src/app/motion.rs`).
# Every call is safe Rust. zbus and windows are already in the tree through eframe.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
muda = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["std", "UI_ViewManagement"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
