[package]
name = "mortise-app"
description = "The Mortise desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mortise_app"

[[bin]]
name = "mortise"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
mortise-core.workspace = true
rfd.workspace = true

[dev-dependencies]
mortise-core = { workspace = true, features = ["testing"] }
egui_kittest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# The setting of macOS that asks for less motion. Both calls are safe Rust.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }
muda = { version = "0.21", default-features = false }
