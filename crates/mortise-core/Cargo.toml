[package]
name = "mortise-core"
description = "Reads Laravel apps that use nwidart/laravel-modules. No interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["watch", "actuator", "os-secrets"]
# Reading the runtime status of a running app over HTTP.
actuator = ["dep:ureq"]
# Keeping secrets in the credential store of the operating system.
os-secrets = ["dep:keyring"]
# A small actuator for tests, also for the tests of other crates.
testing = []
# Watching an app folder for changes. A tool that reads once can leave it out.
watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
directories.workspace = true
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
quick-xml.workspace = true
ureq = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
rayon.workspace = true
ignore.workspace = true
mago-allocator.workspace = true
mago-database.workspace = true
mago-names.workspace = true
mago-span.workspace = true
mago-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
mortise-core = { path = ".", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
