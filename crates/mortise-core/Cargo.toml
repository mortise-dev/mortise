[package]
name = "mortise-core"
description = "Reads Laravel apps that use nwidart/laravel-modules. No interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["watch"]
# Watching an app folder for changes. A tool that reads once can leave it out.
watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
directories.workspace = true
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
quick-xml.workspace = true
rayon.workspace = true
ignore.workspace = true
mago-allocator.workspace = true
mago-database.workspace = true
mago-names.workspace = true
mago-span.workspace = true
mago-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
